# @package data.data_processor

# How to process the extracted data, for the data that carries taus and FET.

_target_: loader.processing.L1DataProcessor
extracted_folder: ${data.data_extractor.cache_root_dir}/extracted/${data.data_extractor.name}

# Remove events saturated in ET.
event_filters:
  ET: 'Et < 4095'

# Mask objects with energies above certain saturation thresholds. The 511 is the
# all-ones code of the 9-bit muon, e-gamma and tau Et. Jet Et is 11 bits wide and
# saturates at 2047, so the cut on jets is the study's own threshold rather than a
# hardware limit.
object_filters:
  muons: 'Et < 511'
  egammas: 'Et < 511'
  jets: 'Et < 511'
  taus: 'Et < 511'
  FET: 'Et < 4095'

cache_root_dir: ${paths.data_dir}
name: e${data.data_extractor.name}_pdefaultTauFET
