# @package data.data_processor

# How to process the extracted data, for the data that carries taus and FET.

_target_: loader.processing.L1DataProcessor
extracted_folder: ${data.data_extractor.cache_root_dir}/extracted/${data.data_extractor.name}

# Remove events saturated in ET.
event_filters:
  ET: 'Et < 4095'

# Remove saturated objects, each threshold the all-ones code of the object's own Et
# width: 9 bits for muons, e-gammas and taus, 11 for jets, 12 for FET. The thresholds
# match the axol1tl training code (l1_anomaly_ae, axo/data_util/_saturation.py), which
# zeroes the objects in place; here they are removed, so a saturated object does not
# count towards the multiplicity.
object_filters:
  muons: 'Et < 511'
  egammas: 'Et < 511'
  jets: 'Et < 2047'
  taus: 'Et < 511'
  FET: 'Et < 4095'

cache_root_dir: ${paths.data_dir}
# The cache is reused whenever a file of this name exists, whatever is inside it, so a
# changed filter above needs either a new name here or the old cache deleted.
name: e${data.data_extractor.name}_pdefaultTauFET
