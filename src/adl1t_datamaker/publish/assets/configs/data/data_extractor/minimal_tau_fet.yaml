# @package data.data_extractor

# Which objects and features to read out of the published tables.
#
# This adds the taus to the minimal configuration and replaces MET with FET, the missing
# energy sum that also counts the forward calorimeters. It is what the published studies
# were run with.

_target_: loader.extraction.L1DataExtractor
select_features:
  muons: ['muonIEt', 'muonIPhi', 'muonIEta']
  jets: ['jetIEt', 'jetIEta', 'jetIPhi']
  egammas: ['egIEt', 'egIEta', 'egIPhi']
  taus: ['tauIEt', 'tauIEta', 'tauIPhi']
  ET: ['Et']
  FET: ['Et', 'phi']
  HT: ['Et']
  event_info: ['nPV_True']
  seeds: ['L1bit']

# Change the field names for easier access when processing.
feat_name_map:
  muons:
    muonIEt: Et
    muonIPhi: phi
    muonIEta: eta
  jets:
    jetIEt: Et
    jetIPhi: phi
    jetIEta: eta
  egammas:
    egIEt: Et
    egIPhi: phi
    egIEta: eta
  taus:
    tauIEt: Et
    tauIPhi: phi
    tauIEta: eta

cache_root_dir: ${paths.data_dir}
name: minimalTauFET
