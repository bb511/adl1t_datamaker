# Base configuration for h5 conversion.
defaults:
  - converter: default
  - paths: default
  - _self_

# Root directory where to write all the converted files to.
output_root_path: ???

# The number of root files to convert at the same time.
ncores: 1

# Whether to replace parquet files already present in the output folder. Keep this
# False so that a repeated input file name cannot silently clobber an earlier
# conversion; set it to True to deliberately reconvert a run.
allow_overwrite: False
